# topics.yaml — 토픽 클러스터 + 시드 키워드 (니치: 기술/SaaS·개발·AI 도구, 영어 Tier-1)
# keyword_research / generator 가 소비. 의도 우선순위: comparison ≥ transactional > informational (F7).
# 각 페이지는 quality_gate 통과 필수 — programmatic 패턴마다 unique_data(가격표·기능매트릭스·실측·핸즈온) 강제.
# ⚠️ 시드는 출발점. 실제 검색량·경쟁도는 Search Console/키워드 데이터로 검증 후 확장(절대 수치 맹신 금지).
#
# 🎯 "이길 수 있는 롱테일"(2026-07-03, 콜드스타트 전략): 신생·저권위 사이트는 헤드 비교어("cursor vs copilot")를
#    단기 랭크 불가 → (a) 신규/니치 엔티티(대형사이트 미포화) + (b) 페르소나·제약 한정(for python devs / for solo)
#    + (c) 구체 how-to(빠른 랭크→허브로 내부링크) 로 진입. 경쟁도는 GSC 데이터로 검증할 가설(절대 수치 아님).

# 📌 제목 계약(title_policy, 2026-07-24) — 반려 4건 중 3건이 "제목은 순위를 약속하고 본문은 순위를 거부"였다
#    (team/reports/2026-07-24-11-review.md ③ 공통결함 ①). 시드가 'best/cheapest/top N' 이어도 **제목은 시드의
#    복사본이 아니다** — 이행하지 못할 최상급은 제목에서 뺀다(F12 misleading headline·thin content 회피).
#    ⚠️ rev1 에서는 이 블록을 **코드가 읽지 않았다**(engine 전체 grep 0건 = 값을 바꿔도 동작 불변인 장식).
#    rev2(2026-07-24)부터 실제로 읽는다 — engine/content/generator.py `title_policy()`:
#      · superlative_requires 각 항목 → _title_contract_block() 의 프롬프트 요구사항 줄 + selfcheck 검사 활성화
#      · otherwise → 이행 불가 시 지시(retitle)  · never(빈 값이면 해제) → 순위거부 본문 검사 활성화
#    아래 키를 지우거나 비우면 프롬프트 문구와 [title-contract] 검사가 실제로 사라진다
#    (실측: team/reports/2026-07-24-14-content.md rev2 P4 — 5건 → 3건, 프롬프트 4줄 → 3줄).
title_policy:
  superlative_requires:            # 'best/cheapest/top N/#1/ultimate' 제목을 쓰려면 셋 다 있어야 한다
    - stated_selection_criteria    # "어떤 기준으로 골랐는가"를 본문에 명시 → 스캐너: _criteria_unit(실질 분량 요구)
    - named_pick_per_use_case      # tldr/verdict 가 use case 별로 지목  → 스캐너: _named_pick(제품명 실제 등장)
    - opinion_framing              # 객관적 사실이 아니라 '본 사이트의 판단'으로 표현 → 프롬프트 전용(스캐너 검사 없음:
                                   #   토큰 검사를 붙이면 상투구 덧대기 게이밍만 유발하므로 의도적으로 두지 않음)
  otherwise: retitle               # 못 채우면 최상급을 빼고 "How to choose …" / "… compared" 로 제목 변경
  never: superlative_title_over_no_ranking_body   # "best" 제목 + "there is no single best" 본문 = 반려

# ═══════════════════════════════════════════════════════════════════════════════════════════
# 🔥 trend_axis — 신규 생성 전용 축 (ORDER 2026-08-01-45-content, 사람 승인)
# ═══════════════════════════════════════════════════════════════════════════════════════════
# 왜 이 블록이 생겼나 (2026-08-01 실측 — 추정 아님):
#   서버 nginx 로그에서 봇·나·서버 IP 를 뺀 **외부 실사람 방문**의 1위가 `/compare/orca-vs-herdr-…/`
#   63회(고유 IP 56)였고, 전체 검색유입 59회 중 **31회(53%)가 이 1편**이었다. 유입 엔진은
#   DuckDuckGo 16 · Brave 4 · Kagi 4 · Bing 3 이고 **구글은 1**이다. 같은 기간 GSC 색인은 42 URL 중 0,
#   사이트맵은 07-25 제출 후 7일째 isPending, 진짜 Googlebot 은 2주간 29히트에 sitemap 요청 0회였다.
#   dev.to 신디케이션은 25편 169뷰·리액션 0으로 사실상 무효였다.
#   → 백링크 0인 신규 서브도메인이 **이길 수 있었던 유일한 지형은 "경쟁 문서가 존재하지 않는 신생 엔티티"**다.
#
# 규칙 (orchestrator.stage_generate 가 실제로 강제한다 — 장식 아님):
#   ① 트렌드 모드에서는 **여기 있는 후보만** 시드가 된다. 백로그(clusters.seeds ·
#      sequencing.next_batch_priority)는 읽지 않는다.
#   ② 후보가 소진되면 **폴백하지 않고 0편**으로 끝낸다(`fallback_to_backlog: false`).
#      0편은 정지 사유가 아니다 — guardrails.zero_generation_alert_days 는 알림만 낸다.
#   ③ 식별자는 **사람이 미리 확정**한다(아래 official_url·github·npm·kind·why).
#      07-08 반려 루프의 직접 원인은 "신생 툴이라서"가 아니라 **공식 URL 자동 발견 실패**였다 →
#      발견 단계 자체를 없앤다(generator 가 이 값을 그대로 페치·관측한다).
#   ④ `kind` 가 다르면 비교하지 않는다(IDE↔CLI 금지). 짝은 **관측 전에** 확정하고, 수치가 나쁘다고
#      짝을 바꿔 재관측하지 않는다(1회 원칙 — 43c-review ③).
#   ⑤ 관측표(observed.py `usable()`)를 못 만들면 그 후보는 **버린다**. 표 없는 트렌드 글은 큐에 넣지 않는다.
#
# ⚠️ npm 이름 스쿼팅 함정 (2026-08-01 실측): 이름이 같다고 그 제품이 아니다. 실제로 확인한 것 —
#     `catnip`→alextewpin/catnip · `uzi`→icholy/uzi · `sculptor`→twolfson/sculptor ·
#     `omnara`→omnara/omnara-voice 로 **전부 다른 프로젝트**였다. 그래서 npm 은 소유가 확인된
#     `ccmanager`(kbwo) · `happy`(slopus) **두 개만** 적었다. (observed.py 가 owner 대조로 한 번 더 막는다.)
# ⚠️ 저장소 이전도 실측됐다: `ogulcancelik/herdr` → **herdrdev/herdr**, `block/goose` → aaif-goose/goose.
#     식별자는 값이지 상식이 아니다 — 바뀌면 여기를 고친다.
#     ⚠️ 휴면 저장소 실측 제외 (2026-08-01): `devflowinc/uzi` **2025-06-04 이후 커밋 0** ·
#     `omnara-ai/omnara` 2026-01-19 이후 커밋 0. 두 저장소가 낀 짝 4개(uzi×2 · omnara×2)는 3기준
#     (docs 200 · 공개 저장소 · 심층 비교글 부재)을 **전부 통과했지만 후보에서 뺐다** — 관측표가
#     `min_rows` 를 못 넘어 파이프라인이 어차피 버리고(실측), 무엇보다 1년 넘게 멈춘 도구를
#     현역처럼 비교하는 글은 Roo Code(2026-05-15 개발 중단)를 반려한 것과 같은 사유로 부적합하다.
trend_axis:
  enabled: true                  # false 로 두면 기존 백로그 경로로 즉시 되돌아간다(코드 수정 불필요)
  fallback_to_backlog: false     # 🔴 후보 소진 시 백로그로 내려가지 않는다 → 그날은 0편
  # 검증일 2026-08-01. 3기준 전부 실호출로 확인한 것만 올렸다:
  #   (1) official_url 200  (2) GitHub 공개 저장소 + observed 표 성립  (3) 심층 비교글 부재(검색 확인)
  # 순서 = 우선순위. 같은 엔티티가 연속되지 않게 배치했다(연속 생성 시 근접중복 위험 완화).
  candidates:
    - keyword: "container use vs sculptor"
      cluster: ai-coding-tools
      why: "에이전트를 컨테이너에 격리하는 두 방식(MCP 서버 vs 데스크톱 UI). 각각의 소개글은 있어도 둘을 나란히 잰 글이 없다."
      entities:
        - name: "Container Use"
          kind: containerized-agent-workspace
          official_url: "https://container-use.com/introduction"
          extra_urls: ["https://github.com/dagger/container-use#readme"]
          github: dagger/container-use
          why: "Dagger's own repository for the project"
        - name: "Sculptor"
          kind: containerized-agent-workspace
          official_url: "https://imbue.com/product/sculptor"
          extra_urls: ["https://github.com/imbue-ai/sculptor#readme"]
          github: imbue-ai/sculptor
          why: "Imbue's own repository for the project"

    - keyword: "sculptor vs catnip"
      cluster: ai-coding-tools
      why: "컨테이너로 에이전트를 격리하는 또 다른 짝. catnip 은 검색에 비교 콘텐츠가 아예 잡히지 않는 수준의 저포화다."
      entities:
        - name: "Sculptor"
          kind: containerized-agent-workspace
          official_url: "https://imbue.com/product/sculptor"
          github: imbue-ai/sculptor
          why: "Imbue's own repository for the project"
        - name: "Catnip"
          kind: containerized-agent-workspace
          official_url: "https://github.com/wandb/catnip#readme"
          github: wandb/catnip
          # 내부 메모(렌더 금지): npm `catnip` 은 alextewpin/catnip 로 무관 — 등록하지 않는다
          why: "the Weights & Biases repository for the project"

    - keyword: "ccmanager vs herdr"
      cluster: ai-coding-tools
      why: "tmux 를 요구하지 않는 세션 매니저 vs 에이전트 인지형 멀티플렉서. 개별 리뷰만 있고 짝 비교가 없다."
      entities:
        - name: "CCManager"
          kind: terminal-agent-manager
          official_url: "https://github.com/kbwo/ccmanager#readme"
          github: kbwo/ccmanager
          npm: ccmanager
          why: "the project's own repository and the npm package published from it"
        - name: "herdr"
          kind: terminal-agent-manager
          official_url: "https://herdr.dev/"
          extra_urls: ["https://herdr.dev/docs/", "https://github.com/herdrdev/herdr#readme"]
          github: herdrdev/herdr
          why: "the project's own repository, where its releases are published"

    - keyword: "container use vs catnip"
      cluster: ai-coding-tools
      why: "컨테이너 격리 계열의 세 번째 짝. 둘 다 비교 콘텐츠가 사실상 없다."
      entities:
        - name: "Container Use"
          kind: containerized-agent-workspace
          official_url: "https://container-use.com/introduction"
          extra_urls: ["https://github.com/dagger/container-use#readme"]
          github: dagger/container-use
          why: "Dagger's own repository for the project"
        - name: "Catnip"
          kind: containerized-agent-workspace
          official_url: "https://github.com/wandb/catnip#readme"
          github: wandb/catnip
          why: "the Weights & Biases repository for the project"

    - keyword: "happy vs agentapi"
      cluster: ai-coding-tools
      why: "로컬 코딩 에이전트를 터미널 밖에서 몰기 위한 두 접근(모바일/웹 클라이언트 vs HTTP API 서버). 검색엔진이 이 짝을 인식조차 못 하는 수준의 저포화이고, 두 저장소 모두 활성이다."
      entities:
        - name: "Happy Coder"
          kind: agent-remote-control
          official_url: "https://happy.engineering/"
          extra_urls: ["https://github.com/slopus/happy#readme"]
          github: slopus/happy
          npm: happy
          why: "the project's own repository and the npm package published from it"
        - name: "AgentAPI"
          kind: agent-remote-control
          official_url: "https://coder.github.io/agentapi/"
          extra_urls: ["https://github.com/coder/agentapi#readme"]
          github: coder/agentapi
          why: "Coder's own repository for the project"

    - keyword: "ccmanager vs claude squad"
      cluster: ai-coding-tools
      why: "tmux 를 요구하지 않는 세션 매니저 vs tmux 기반 병렬 TUI. ⚠️ 3기준 중 (3)이 가장 약하다 — 자동생성 의존성 비교 페이지와 라운드업이 둘을 함께 다룬다(심층 1:1 은 없음). PM 판단(2026-08-01): **남기되 우선순위 최하위** — 기준3의 취지는 '우리가 이길 수 있는가'이고 저품질 자동생성 페이지는 이길 수 있다."
      entities:
        - name: "CCManager"
          kind: terminal-agent-manager
          official_url: "https://github.com/kbwo/ccmanager#readme"
          github: kbwo/ccmanager
          npm: ccmanager
          why: "the project's own repository and the npm package published from it"
        - name: "Claude Squad"
          kind: terminal-agent-manager
          official_url: "https://smtg-ai.github.io/claude-squad/"
          extra_urls: ["https://github.com/smtg-ai/claude-squad#readme"]
          github: smtg-ai/claude-squad
          why: "the project's own repository, where its releases are published"

    # ⏸ 우선순위 최하위로 미뤄 둠 (2026-08-01, ORDER 51-ops 후속 — PM 지시).
    #    왜: 이 주제의 **시범편이 이미 dist/pending_approval 에 사람 승인 대기**로 존재한다(9회차 산출물).
    #        그대로 두면 자동 실행이 같은 주제를 처음부터 다시 써서 같은 주제 두 편이 남는다.
    #    ⚠️ 근접중복 가드는 이걸 막지 못한다 — 실측(2026-08-01): k=5 단어 shingle 의 Jaccard, 임계 0.70
    #        인데 원문 단어의 90%만 남긴 변형이 이미 0.4671 이다(70% 유지 → 0.1302).
    #        축자 복제 탐지기이지 '같은 주제 재작성' 탐지기가 아니다. 상세는 AUTOMATION.md §3.
    #    복구 조건: 사람이 시범편을 **승인하거나 거부해 상태가 확정되면** 원위치(맨 앞)로 되돌린다.
    #        ⛔ published.json 에는 손대지 않는다 — 발행되지 않은 것을 발행됐다고 적는 것은 상태 파일에
    #        거짓을 넣는 것이고, 사람이 승인하지 않으면 그 주제가 영구히 건너뛰어진다.
    - keyword: "claude squad vs herdr"
      cluster: ai-coding-tools
      why: "둘 다 터미널에서 여러 코딩 에이전트를 붙잡아 두는 도구인데 이 짝을 정면으로 다룬 글이 없다. 유일하게 실트래픽이 붙은 orca-vs-herdr 와 같은 지형이고 내부링크로 이어진다."
      entities:
        - name: "Claude Squad"
          kind: terminal-agent-manager
          official_url: "https://smtg-ai.github.io/claude-squad/"
          extra_urls: ["https://github.com/smtg-ai/claude-squad#readme"]
          github: smtg-ai/claude-squad
          why: "the project's own repository, where its releases are published"
        - name: "herdr"
          kind: terminal-agent-manager
          official_url: "https://herdr.dev/"
          extra_urls: ["https://herdr.dev/docs/", "https://github.com/herdrdev/herdr#readme"]
          github: herdrdev/herdr
          # 내부 메모(렌더 금지): 2026-08-01 확인 — ogulcancelik/herdr 에서 herdrdev/herdr 로 이전(301)
          why: "the project's own repository, where its releases are published"

clusters:
  # ── P1: AI 코딩/개발 도구 (트렌딩·고의도·E-E-A-T 적합) ──
  - id: ai-coding-tools
    priority: 1
    hub: "Best AI coding assistants (2026)"
    intent: [comparison, transactional]
    patterns:                      # 프로그래매틱 생성 템플릿 ({} = 엔티티)
      - "{toolA} vs {toolB}"
      - "best alternatives to {tool}"
      - "{tool} review: pricing, features, is it worth it"
      - "how to {task} with {tool}"
    unique_data: [pricing_table, feature_matrix, hands_on_notes]
    seeds:
      - "cursor vs github copilot"        # comparison
      - "claude code vs cursor"
      - "github copilot vs codeium"
      - "cursor vs windsurf"
      - "github copilot alternatives"     # transactional
      - "is github copilot worth it"      # transactional
      - "best ai code review tools"
      # 🎯 이길 수 있는 롱테일 (신규/니치 엔티티·페르소나 한정)
      - "aider vs cursor"                 # comparison — Aider(CLI AI) 신규·심층비교 희소
      - "cline vs continue"               # comparison — 오픈소스 VS Code AI 확장, 초저경쟁
      - "zed vs cursor"                   # comparison — Zed 트렌딩·비교 콘텐츠 희소
      # 🔥 2026-07 핫 트렌딩 (에이전트 오케스트레이션 — 초저포화, 공식 docs 확인됨)
      - "orca vs herdr"                   # comparison — 병렬 에이전트 IDE(orca) vs 터미널 agent 멀티플렉서(herdr)
      - "herdr vs tmux"                   # comparison — agent-aware 멀티플렉서(herdr) vs 클래식 tmux
      - "best ai coding assistant for python developers"  # transactional — 페르소나 한정
      - "is cursor worth it for solo developers"          # transactional — 페르소나 worth-it

  # ── P1: VPS·클라우드 호스팅·셀프호스팅 (서버 운영 경험 = 최강 E-E-A-T) ──
  - id: hosting-selfhost
    priority: 1
    hub: "Best cheap VPS hosting for developers (2026)"
    intent: [comparison, transactional]
    patterns:
      - "{providerA} vs {providerB}"
      - "best VPS for {use_case}"
      - "how to self-host {app}"
      - "best self-hosted alternatives to {saas}"
    unique_data: [pricing_table, benchmark, hands_on_notes]
    seeds:
