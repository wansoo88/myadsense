# topics.yaml — 토픽 클러스터 + 시드 키워드 (니치: 기술/SaaS·개발·AI 도구, 영어 Tier-1)
# keyword_research / generator 가 소비. 의도 우선순위: comparison ≥ transactional > informational (F7).
# 각 페이지는 quality_gate 통과 필수 — programmatic 패턴마다 unique_data(가격표·기능매트릭스·실측·핸즈온) 강제.
# ⚠️ 시드는 출발점. 실제 검색량·경쟁도는 Search Console/키워드 데이터로 검증 후 확장(절대 수치 맹신 금지).
#
# 🎯 "이길 수 있는 롱테일"(2026-07-03, 콜드스타트 전략): 신생·저권위 사이트는 헤드 비교어("cursor vs copilot")를
#    단기 랭크 불가 → (a) 신규/니치 엔티티(대형사이트 미포화) + (b) 페르소나·제약 한정(for python devs / for solo)
#    + (c) 구체 how-to(빠른 랭크→허브로 내부링크) 로 진입. 경쟁도는 GSC 데이터로 검증할 가설(절대 수치 아님).

# 📌 제목 계약(title_policy, 2026-07-24) — 반려 4건 중 3건이 "제목은 순위를 약속하고 본문은 순위를 거부"였다
#    (team/reports/2026-07-24-11-review.md ③ 공통결함 ①). 시드가 'best/cheapest/top N' 이어도 **제목은 시드의
#    복사본이 아니다** — 이행하지 못할 최상급은 제목에서 뺀다(F12 misleading headline·thin content 회피).
#    ⚠️ rev1 에서는 이 블록을 **코드가 읽지 않았다**(engine 전체 grep 0건 = 값을 바꿔도 동작 불변인 장식).
#    rev2(2026-07-24)부터 실제로 읽는다 — engine/content/generator.py `title_policy()`:
#      · superlative_requires 각 항목 → _title_contract_block() 의 프롬프트 요구사항 줄 + selfcheck 검사 활성화
#      · otherwise → 이행 불가 시 지시(retitle)  · never(빈 값이면 해제) → 순위거부 본문 검사 활성화
#    아래 키를 지우거나 비우면 프롬프트 문구와 [title-contract] 검사가 실제로 사라진다
#    (실측: team/reports/2026-07-24-14-content.md rev2 P4 — 5건 → 3건, 프롬프트 4줄 → 3줄).
title_policy:
  superlative_requires:            # 'best/cheapest/top N/#1/ultimate' 제목을 쓰려면 셋 다 있어야 한다
    - stated_selection_criteria    # "어떤 기준으로 골랐는가"를 본문에 명시 → 스캐너: _criteria_unit(실질 분량 요구)
    - named_pick_per_use_case      # tldr/verdict 가 use case 별로 지목  → 스캐너: _named_pick(제품명 실제 등장)
    - opinion_framing              # 객관적 사실이 아니라 '본 사이트의 판단'으로 표현 → 프롬프트 전용(스캐너 검사 없음:
                                   #   토큰 검사를 붙이면 상투구 덧대기 게이밍만 유발하므로 의도적으로 두지 않음)
  otherwise: retitle               # 못 채우면 최상급을 빼고 "How to choose …" / "… compared" 로 제목 변경
  never: superlative_title_over_no_ranking_body   # "best" 제목 + "there is no single best" 본문 = 반려

# ═══════════════════════════════════════════════════════════════════════════════════════════
# 🔥 trend_axis — 신규 생성 전용 축 (ORDER 2026-08-01-45-content, 사람 승인)
# ═══════════════════════════════════════════════════════════════════════════════════════════
# 왜 이 블록이 생겼나 (2026-08-01 실측 — 추정 아님):
#   서버 nginx 로그에서 봇·나·서버 IP 를 뺀 **외부 실사람 방문**의 1위가 `/compare/orca-vs-herdr-…/`
#   63회(고유 IP 56)였고, 전체 검색유입 59회 중 **31회(53%)가 이 1편**이었다. 유입 엔진은
#   DuckDuckGo 16 · Brave 4 · Kagi 4 · Bing 3 이고 **구글은 1**이다. 같은 기간 GSC 색인은 42 URL 중 0,
#   사이트맵은 07-25 제출 후 7일째 isPending, 진짜 Googlebot 은 2주간 29히트에 sitemap 요청 0회였다.
#   dev.to 신디케이션은 25편 169뷰·리액션 0으로 사실상 무효였다.
#   → 백링크 0인 신규 서브도메인이 **이길 수 있었던 유일한 지형은 "경쟁 문서가 존재하지 않는 신생 엔티티"**다.
#
# 규칙 (orchestrator.stage_generate 가 실제로 강제한다 — 장식 아님):
#   ① 트렌드 모드에서는 **여기 있는 후보만** 시드가 된다. 백로그(clusters.seeds ·
#      sequencing.next_batch_priority)는 읽지 않는다.
#   ② 후보가 소진되면 **폴백하지 않고 0편**으로 끝낸다(`fallback_to_backlog: false`).
#      0편은 정지 사유가 아니다 — guardrails.zero_generation_alert_days 는 알림만 낸다.
#   ③ 식별자는 **사람이 미리 확정**한다(아래 official_url·github·npm·kind·why).
#      07-08 반려 루프의 직접 원인은 "신생 툴이라서"가 아니라 **공식 URL 자동 발견 실패**였다 →
#      발견 단계 자체를 없앤다(generator 가 이 값을 그대로 페치·관측한다).
#   ④ `kind` 가 다르면 비교하지 않는다(IDE↔CLI 금지). 짝은 **관측 전에** 확정하고, 수치가 나쁘다고
#      짝을 바꿔 재관측하지 않는다(1회 원칙 — 43c-review ③).
#   ⑤ 관측표(observed.py `usable()`)를 못 만들면 그 후보는 **버린다**. 표 없는 트렌드 글은 큐에 넣지 않는다.
#
# ⚠️ npm 이름 스쿼팅 함정 (2026-08-01 실측): 이름이 같다고 그 제품이 아니다. 실제로 확인한 것 —
#     `catnip`→alextewpin/catnip · `uzi`→icholy/uzi · `sculptor`→twolfson/sculptor ·
#     `omnara`→omnara/omnara-voice 로 **전부 다른 프로젝트**였다. 그래서 npm 은 소유가 확인된
#     `ccmanager`(kbwo) · `happy`(slopus) **두 개만** 적었다. (observed.py 가 owner 대조로 한 번 더 막는다.)
# ⚠️ 저장소 이전도 실측됐다: `ogulcancelik/herdr` → **herdrdev/herdr**, `block/goose` → aaif-goose/goose.
#     식별자는 값이지 상식이 아니다 — 바뀌면 여기를 고친다.
#     ⚠️ 휴면 저장소 실측 제외 (2026-08-01): `devflowinc/uzi` **2025-06-04 이후 커밋 0** ·
#     `omnara-ai/omnara` 2026-01-19 이후 커밋 0. 두 저장소가 낀 짝 4개(uzi×2 · omnara×2)는 3기준
#     ⚠️ **omnara 판정은 2026-08-15 재호출에서 무효가 됐다** — 마지막 푸시가 2026-08-15 다(되살아났다).
#        uzi 는 여전히 2025-06-04 로 멈춰 있다. 한 번 관측한 상태를 영구 사실로 굳히지 말 것.
#        원장: config/observed_history.yaml (`omnara-revived`).
#     (docs 200 · 공개 저장소 · 심층 비교글 부재)을 **전부 통과했지만 후보에서 뺐다** — 관측표가
#     `min_rows` 를 못 넘어 파이프라인이 어차피 버리고(실측), 무엇보다 1년 넘게 멈춘 도구를
#     현역처럼 비교하는 글은 Roo Code(2026-05-15 개발 중단)를 반려한 것과 같은 사유로 부적합하다.
trend_axis:
  enabled: true                  # false 로 두면 기존 백로그 경로로 즉시 되돌아간다(코드 수정 불필요)
  fallback_to_backlog: false     # 🔴 후보 소진 시 백로그로 내려가지 않는다 → 그날은 0편
  # 검증일 2026-08-01. 3기준 전부 실호출로 확인한 것만 올렸다:
  #   (1) official_url 200  (2) GitHub 공개 저장소 + observed 표 성립  (3) 심층 비교글 부재(검색 확인)
  # 순서 = 우선순위. 같은 엔티티가 연속되지 않게 배치했다(연속 생성 시 근접중복 위험 완화).
  candidates:
    # ── 2026-08-08 추가 (trend_scout b162ca3 산출물에서 CONTENT 가 확정 — ORDER 45 ③ 유지) ──
    # 검증 3기준 전부 실호출로 확인:
    #   (1) official_url 200 — github.com/clawkwork/clawk#readme 200 · imbue.com/product/sculptor 200
    #   (2) 관측표 성립 — observed.collect 실행 결과 live_rows 3 · distinct_rows 3 · usable()=True
    #       (clawk: v0.3.0 2026-08-05 · 주 2.5커밋 · 최종 08-05 / sculptor: sculptor-v0.44.0rc2 2026-08-07 ·
    #        주 151.6커밋 · 최종 08-07 — 세 행 모두 값이 갈린다)
    #   (3) 심층 비교글 부재 — 검색 2회. 전용 1:1 비교글 0건이고, 두 번째 질의는 clawk 자체를 못 찾았다.
    #       개별 소개(Developers Digest·rywalker)와 샌드박스 라운드업(Blaxel·Northflank)은 있으나 이 짝은 없다.
    #       = orca-vs-herdr(검색유입 53%)와 같은 지형.
    # ⚠️ kind 를 `containerized-agent-workspace` 로 적지 않았다 — clawk 은 컨테이너가 아니라 **VM**
    #    (Apple Virtualization.framework / Firecracker)이다. 두 엔티티에 같은 문자열을 줘야
    #    `equivalent_kinds()` 가 통과하므로 상위 축인 `isolated-agent-workspace` 로 맞췄다.
    #    격리 방식의 차이(하이퍼바이저 경계 vs 컨테이너)가 이 글의 본론이지 비교 불가 사유가 아니다.
    # 📌 URL 배분: `_trend_hints` 가 제품별 라운드로빈으로 섞고 `grounding.max_sources: 5` 에서 자른다.
    #    clawk 2개 · sculptor 3개 = 정확히 5개라 **아무것도 안 잘린다**. 실측 산문량(크롬 제외):
    #    clawk 14,037+11,940=약 24k · sculptor 5,780+4,761+5,488=약 16k → 1.5배. 한쪽 열이 비지 않는다.
    #    (대조: ccmanager 13,252 vs claude-squad 5,162 = 2.6배가 '공백 56%'로 반복 탈락한 그 짝이다.)
    - keyword: "clawk vs sculptor"
      cluster: ai-coding-tools
      why: "코딩 에이전트를 격리하는 두 경계 — 하이퍼바이저(일회용 리눅스 VM) vs 도커 컨테이너. 둘 다 2026년 신생이고 개별 소개글만 있을 뿐 이 짝을 정면으로 잰 글이 없다. catnip 소멸로 짝을 잃은 sculptor 를 살아 있는 상대와 다시 세운다."
      entities:
        # 🔴 표기는 소문자 `clawk` 이다 (2026-08-08 발행분 검수 [coherence] 지적 → OPS 요청).
        #    표 머리글은 이 `name` 을 **그대로** 쓰는데(`observed._col_id`), 본문은 저장소 표기를 따라
        #    소문자로 쓰므로 대문자로 두면 같은 페이지 안에서 두 표기가 갈린다.
        #    근거(README 실물 실측): 소문자 `clawk` **67회** · 대문자 `Clawk` **0회**. 헤딩도 전부 소문자다.
        #    선례: `herdr` 도 같은 이유로 소문자로 적혀 있다.
        - name: "clawk"
          kind: isolated-agent-workspace
          official_url: "https://github.com/clawkwork/clawk#readme"
          extra_urls: ["https://github.com/clawkwork/clawk/blob/main/docs/commands.md"]
          github: clawkwork/clawk
          # 내부 메모(렌더 금지): 홈페이지 없음(GitHub API homepage=null) — 문서가 저장소 안에만 있다.
          #   docs/configuration.md(11,268자)도 후보였으나 max_sources 5 에서 sculptor 쪽이 잘려
          #   비대칭이 되므로 넣지 않았다.
          why: "the project's own repository, where its releases are published"
        - name: "Sculptor"
          kind: isolated-agent-workspace
          official_url: "https://imbue.com/product/sculptor"
          extra_urls: ["https://github.com/imbue-ai/sculptor#readme", "https://imbue.com/blog/sculptor-announce"]
          github: imbue-ai/sculptor
          why: "Imbue's own repository for the project"

    - keyword: "container use vs sculptor"
      cluster: ai-coding-tools
      why: "에이전트를 컨테이너에 격리하는 두 방식(MCP 서버 vs 데스크톱 UI). 각각의 소개글은 있어도 둘을 나란히 잰 글이 없다."
      entities:
        - name: "Container Use"
          kind: containerized-agent-workspace
          official_url: "https://container-use.com/introduction"
          extra_urls: ["https://github.com/dagger/container-use#readme"]
          github: dagger/container-use
          why: "Dagger's own repository for the project"
        - name: "Sculptor"
          kind: containerized-agent-workspace
          official_url: "https://imbue.com/product/sculptor"
          extra_urls: ["https://github.com/imbue-ai/sculptor#readme"]
          github: imbue-ai/sculptor
          why: "Imbue's own repository for the project"

    # ⛔ 제거됨 2026-08-08: "sculptor vs catnip" · "container use vs catnip"
    #    사유: `wandb/catnip` 이 GitHub 에서 사라졌다(404 실측 — 08-04 존재 → 08-06 소멸).
    #    저장소가 없으면 official_url 도 관측표도 성립하지 않아 파이프라인이 **매일 자동으로 드롭**했다.
    #    남겨두면 매일 헛돈다(OPS 보고 2026-08-08). sculptor 는 위 `clawk vs sculptor` 로 살아 있는 짝을 얻었다.

    - keyword: "ccmanager vs herdr"
      cluster: ai-coding-tools
      why: "tmux 를 요구하지 않는 세션 매니저 vs 에이전트 인지형 멀티플렉서. 개별 리뷰만 있고 짝 비교가 없다."
      entities:
        - name: "CCManager"
          kind: terminal-agent-manager
          official_url: "https://github.com/kbwo/ccmanager#readme"
          github: kbwo/ccmanager
          npm: ccmanager
          why: "the project's own repository and the npm package published from it"
        - name: "herdr"
          kind: terminal-agent-manager
          official_url: "https://herdr.dev/"
          extra_urls: ["https://herdr.dev/docs/", "https://github.com/herdrdev/herdr#readme"]
          github: herdrdev/herdr
          why: "the project's own repository, where its releases are published"

    - keyword: "happy vs agentapi"
      cluster: ai-coding-tools
      why: "로컬 코딩 에이전트를 터미널 밖에서 몰기 위한 두 접근(모바일/웹 클라이언트 vs HTTP API 서버). 검색엔진이 이 짝을 인식조차 못 하는 수준의 저포화이고, 두 저장소 모두 활성이다."
      entities:
        - name: "Happy Coder"
          kind: agent-remote-control
          official_url: "https://happy.engineering/"
          extra_urls: ["https://github.com/slopus/happy#readme"]
          github: slopus/happy
          npm: happy
          why: "the project's own repository and the npm package published from it"
        - name: "AgentAPI"
          kind: agent-remote-control
          official_url: "https://coder.github.io/agentapi/"
          extra_urls: ["https://github.com/coder/agentapi#readme"]
          github: coder/agentapi
          why: "Coder's own repository for the project"

    # ⛔ 제거됨 2026-08-08: "ccmanager vs claude squad" (OPS 권고 — 게이트 반복 탈락, LLM 3회/일 낭비)
    #    통설은 "claude-squad 문서가 얇아서"였는데 **실측하니 아니다**(2026-08-08, 크롬 제외 실제 산문):
    #      claude-squad README 4,688 + docs 474 = 5,162자
    #      ↕ 같은 잣대로 잰 발행 성공작: container-use 4,829 · happy 2,881 · **herdr 2,771**(검색유입 53%)
    #    즉 얇아서가 아니라 **상대와의 비대칭**이다 — ccmanager 13,252 vs 5,162 = 2.6배.
    #    한쪽 열 공백 40% 초과 규칙(79e0140)에 매일 걸린 것이 이 기울기다.
    #    → 교훈: 후보 선정에서 볼 것은 '양쪽이 두꺼운가'가 아니라 **'양쪽이 비슷한가'**다.
    #      (위 clawk vs sculptor 는 24k vs 16k = 1.5배로 맞췄다.)

    # ── 2026-08-08 추가 ② (검증 근거는 보고 2026-08-08-52-content) ──
    # (1) official_url 200 — github.com/open-mercato/cezar#readme 200 · imbue.com/product/sculptor 200
    # (2) 관측표 — 등가성 True · **`trend_preflight` 통과**(라이브 3행 · 값이 갈리는 행 2 · API 8/8).
    #     ⚠️ 정정(2026-08-08): 처음에 '미달'로 적었던 것은 내가 `observed.usable()` 을 **함수 기본값**
    #        (min_distinct_rows=3)으로 부른 결과였다. **운영 임계는 config/content.yaml
    #        `observed_data.min_distinct_rows: 2`** 이고(2026-07-28 PM 승인으로 3→2), 파이프라인은
    #        그 값을 쓴다 → **이 후보는 오늘도 성립한다.** 판정은 코드가 실제로 쓰는 임계로 재야 한다.
    #     남은 관찰: 양쪽 최종커밋이 둘 다 2026-08-07 이라 그 행만 값이 같다(릴리스·주간커밋은 갈린다).
    #        임계가 2라 문제가 없고, 날짜가 갈리면 3행 전부 구별된다.
    # (3) 심층 비교글 부재 — 검색 확인. cezar 개별 소개(X·저장소)는 있으나 이 짝의 1:1 은 0건.
    # ⛔ cezar 를 ccmanager 와 붙이지 않았다: "Claude Code 세션 매니저 / 병렬 에이전트 / worktree 도구"
    #    3개 카테고리를 nimbalyst.com 이 전용 비교글로 이미 점유했다(기준3 실패). 그 카테고리는 우리가
    #    이길 수 있는 지형이 아니다 — 같은 사유로 ccmanager vs claude squad 가 위에서 제거됐다.
    # 📌 sculptor 가 위 clawk 짝과 중복 등장한다. 허용한 이유: 축이 다르다(격리 경계 vs 병렬 실행 워크벤치),
    #    그리고 herdr 가 3편에 등장하며 유일하게 실트래픽을 만든 선례가 있다. 근접중복은 걸리지 않는다
    #    (다른 주제 · 서로 다른 주력 제품).
    - keyword: "cezar vs sculptor"
      cluster: ai-coding-tools
      why: "코딩 에이전트를 병렬로 돌리는 두 워크벤치 — 브라우저 콕핏 + git worktree 격리(cezar) vs 데스크톱 앱 + 도커 컨테이너 격리(sculptor). 둘 다 2026년 신생이고 개별 소개만 있을 뿐 이 짝을 정면으로 잰 글이 없다."
      entities:
        # 🔴 소문자 `cezar` 로 **선제 수정**했다 (2026-08-08). clawk 에서 실제로 반려 사유가 된 것과
        #    같은 결함이 이 후보에서 그대로 재발할 참이었다 — 이 글은 내일 09:00 에 뽑힌다.
        #    근거(README 실물 실측): 소문자 `cezar` **60회** · 대문자 `Cezar` 2회(문장 첫머리),
        #    H1 자체가 `cezar ⚡` 다.
        - name: "cezar"
          kind: parallel-agent-workspace
          official_url: "https://github.com/open-mercato/cezar#readme"
          github: open-mercato/cezar
          npm: cezar-cli
          # 내부 메모(렌더 금지): npm 소유 실검증 2026-08-08 — registry repository owner = open-mercato ✅
          #   (30일 다운로드 54,504). 단 sculptor 쪽에 npm 이 없어 npm 행은 렌더되지 않는다
          #   (live_rows 는 전원이 값을 가진 행만 남긴다) — 식별자만 남겨 둔다.
          #   homepage 는 openmercato.com(회사 사이트)이라 제품 근거가 아니므로 쓰지 않았다.
          why: "the project's own repository and the npm package published from it"
        - name: "Sculptor"
          kind: parallel-agent-workspace
          official_url: "https://imbue.com/product/sculptor"
          extra_urls: ["https://github.com/imbue-ai/sculptor#readme", "https://imbue.com/blog/sculptor-announce"]
          github: imbue-ai/sculptor
          why: "Imbue's own repository for the project"

    # ⏸ 우선순위 최하위로 미뤄 둠 (2026-08-01, ORDER 51-ops 후속 — PM 지시).
    #    왜: 이 주제의 **시범편이 이미 dist/pending_approval 에 사람 승인 대기**로 존재한다(9회차 산출물).
    #        그대로 두면 자동 실행이 같은 주제를 처음부터 다시 써서 같은 주제 두 편이 남는다.
    #    ⚠️ 근접중복 가드는 이걸 막지 못한다 — 실측(2026-08-01): k=5 단어 shingle 의 Jaccard, 임계 0.70
    #        인데 원문 단어의 90%만 남긴 변형이 이미 0.4671 이다(70% 유지 → 0.1302).
    #        축자 복제 탐지기이지 '같은 주제 재작성' 탐지기가 아니다. 상세는 AUTOMATION.md §3.
    #    복구 조건: 사람이 시범편을 **승인하거나 거부해 상태가 확정되면** 원위치(맨 앞)로 되돌린다.
    #        ⛔ published.json 에는 손대지 않는다 — 발행되지 않은 것을 발행됐다고 적는 것은 상태 파일에
    #        거짓을 넣는 것이고, 사람이 승인하지 않으면 그 주제가 영구히 건너뛰어진다.
    - keyword: "claude squad vs herdr"
      cluster: ai-coding-tools
      why: "둘 다 터미널에서 여러 코딩 에이전트를 붙잡아 두는 도구인데 이 짝을 정면으로 다룬 글이 없다. 유일하게 실트래픽이 붙은 orca-vs-herdr 와 같은 지형이고 내부링크로 이어진다."
      entities:
        - name: "Claude Squad"
          kind: terminal-agent-manager
          official_url: "https://smtg-ai.github.io/claude-squad/"
          extra_urls: ["https://github.com/smtg-ai/claude-squad#readme"]
          github: smtg-ai/claude-squad
          why: "the project's own repository, where its releases are published"
        - name: "herdr"
          kind: terminal-agent-manager
          official_url: "https://herdr.dev/"
          extra_urls: ["https://herdr.dev/docs/", "https://github.com/herdrdev/herdr#readme"]
          github: herdrdev/herdr
          # 내부 메모(렌더 금지): 2026-08-01 확인 — ogulcancelik/herdr 에서 herdrdev/herdr 로 이전(301)
          why: "the project's own repository, where its releases are published"

    # ═══════════════════════════════════════════════════════════════════════════════════
    # 🔵 2026-08-15 — 짝비교가 **아닌** 축 두 개 (사람 승인: B+C 구축)
    # ═══════════════════════════════════════════════════════════════════════════════════
    # 왜: 2026-08-11 AdSense 거절 사유 하나가 "발행분 전부가 X vs Y 한 포맷"이었다. 그런데 이 축은
    #     짝비교만 만들 수 있었다 — 관측표가 `min_entities: 2` + 값이 갈리는 행을 요구했기 때문이다.
    #     즉 **짝짓기는 목적이 아니라 표를 세우려던 수단**이었다(engine/content/axes.py 참조).
    # `shape` 키가 없으면 `pair` = 기존 동작. 아래 둘만 새 축을 탄다.

    - keyword: "how active are agent sandbox tools 52 weeks of commits"
      shape: timeline                # 열 = 시간. 짝이 필요 없다.
      cluster: ai-coding-tools
      why: >-
        같은 52주 창으로 이 분야 다섯 저장소의 주간 커밋을 나란히 편다. 개별 소개글은 있어도
        "이 분야가 1년 동안 어떻게 움직였나"를 같은 창으로 잰 글이 없다. 창이 모든 저장소에 대해
        동일하므로(항상 '지금까지의 52주') 짝비교에서 났던 1년 시차 사고가 구조적으로 불가능하다.
      # 2026-08-15 전부 실호출 200 확인(마지막 푸시 병기). kind 는 표시용이며 시간축은 등가성을
      # 요구하지 않는다 — 대신 "무엇을 모은 집합인가"를 글이 밝혀야 한다.
      entities:
        - name: "clawk"            # 2026-08-13
          kind: isolated-agent-workspace
          official_url: "https://github.com/clawkwork/clawk#readme"
          github: clawkwork/clawk
          why: "the project's own repository"
        - name: "Sculptor"         # 2026-08-14
          kind: isolated-agent-workspace
          official_url: "https://imbue.com/product/sculptor"
          github: imbue-ai/sculptor
          why: "Imbue's own repository for the project"
        - name: "Container Use"    # 2026-08-12
          kind: isolated-agent-workspace
          official_url: "https://container-use.com/introduction"
          github: dagger/container-use
          why: "Dagger's own repository for the project"
        - name: "herdr"            # 2026-08-15
          kind: isolated-agent-workspace
          official_url: "https://herdr.dev/"
          github: herdrdev/herdr
          why: "the project's own repository"
        - name: "CCManager"        # 2026-08-10
          kind: isolated-agent-workspace
          official_url: "https://github.com/kbwo/ccmanager#readme"
          github: kbwo/ccmanager
          why: "the project's own repository"

    - keyword: "what happens to small dev tool repositories we watched for six weeks"
      shape: landscape             # 열 = 우리 기록 vs 오늘 재확인. 소재가 공개 문서가 아니다.
      cluster: ai-coding-tools
      why: >-
        후보를 매일 검증하며 부딪힌 소멸·이전·정지·이름 도용을 `config/observed_history.yaml` 에
        원장으로 옮겼다. 저장소가 사라진 날은 그날 호출해 본 사람만 안다 — 검색으로는 안 나온다.
        기록은 과거이고 대조는 현재라, 글을 만들 때마다 같은 호출을 다시 해서 나란히 놓는다.
      # ⚠️ `entities` 는 **범위 지정**이다(비우면 원장 전체). 이름은 원장의 `entity` 와 맞춰야 한다.
      #    식별자·URL 은 여기 적지 않는다 — 원장이 들고 있다.
      entities:
        - name: "catnip"
        - name: "uzi"
        - name: "omnara"
        - name: "herdr"
        - name: "goose"
        - name: "paneflow"
        - name: "Sculptor"
        - name: "CCManager"
        - name: "happy"

clusters:
  # ── P1: AI 코딩/개발 도구 (트렌딩·고의도·E-E-A-T 적합) ──
  - id: ai-coding-tools
    priority: 1
    hub: "Best AI coding assistants (2026)"
    intent: [comparison, transactional]
    patterns:                      # 프로그래매틱 생성 템플릿 ({} = 엔티티)
      - "{toolA} vs {toolB}"
      - "best alternatives to {tool}"
      - "{tool} review: pricing, features, is it worth it"
      - "how to {task} with {tool}"
    unique_data: [pricing_table, feature_matrix, hands_on_notes]
    seeds:
      - "cursor vs github copilot"        # comparison
      - "claude code vs cursor"
      - "github copilot vs codeium"
      - "cursor vs windsurf"
      - "github copilot alternatives"     # transactional
      - "is github copilot worth it"      # transactional
      - "best ai code review tools"
      # 🎯 이길 수 있는 롱테일 (신규/니치 엔티티·페르소나 한정)
      - "aider vs cursor"                 # comparison — Aider(CLI AI) 신규·심층비교 희소
      - "cline vs continue"               # comparison — 오픈소스 VS Code AI 확장, 초저경쟁
      - "zed vs cursor"                   # comparison — Zed 트렌딩·비교 콘텐츠 희소
      # 🔥 2026-07 핫 트렌딩 (에이전트 오케스트레이션 — 초저포화, 공식 docs 확인됨)
      - "orca vs herdr"                   # comparison — 병렬 에이전트 IDE(orca) vs 터미널 agent 멀티플렉서(herdr)
      - "herdr vs tmux"                   # comparison — agent-aware 멀티플렉서(herdr) vs 클래식 tmux
      - "best ai coding assistant for python developers"  # transactional — 페르소나 한정
      - "is cursor worth it for solo developers"          # transactional — 페르소나 worth-it

  # ── P1: VPS·클라우드 호스팅·셀프호스팅 (서버 운영 경험 = 최강 E-E-A-T) ──
  - id: hosting-selfhost
    priority: 1
    hub: "Best cheap VPS hosting for developers (2026)"
    intent: [comparison, transactional]
    patterns:
      - "{providerA} vs {providerB}"
      - "best VPS for {use_case}"
      - "how to self-host {app}"
      - "best self-hosted alternatives to {saas}"
    unique_data: [pricing_table, benchmark, hands_on_notes]
    seeds:
      - "digitalocean vs linode vs vultr"
      - "hetzner vs digitalocean"
      - "best cheap vps 2026"
      - "how to self-host nextcloud"
      - "how to self-host ghost blog"
      - "best self-hosted alternatives to notion"
      - "self-hosted analytics vs google analytics"
      # 🎯 이길 수 있는 롱테일 (구체 how-to·저포화 엔티티·기존 글과 내부링크)
      - "how to self-host supabase"       # how-to — supabase-vs-firebase 글과 교차 내부링크
      - "how to self-host n8n"            # how-to — 트렌딩 자동화 툴, 영어권 심층가이드 희소
      - "best self-hosted alternatives to airtable"  # transactional — Baserow/NocoDB 등
      - "hetzner vs contabo"              # comparison — 저가 EU 호스트, 영어권 커버 희소
      - "best vps for self-hosting"       # transactional — use-case 한정

  # ── P2: 개발/SaaS 도구 비교 (대량 볼륨) ──
  - id: dev-saas-compare
    priority: 2
    hub: "Best developer tools by category (2026)"
    intent: [comparison]
    patterns:
      - "{toolA} vs {toolB}"
      - "best {category} software for {use_case}"
      - "{tool} alternatives"
    unique_data: [feature_matrix, pricing_table]
    seeds:
      - "notion vs obsidian"
      - "postman vs insomnia"
      - "linear vs jira"
      - "vercel vs netlify"
      - "supabase vs firebase"
      - "best api testing tools"
      # 🎯 이길 수 있는 롱테일 (신규 PaaS/DB·오픈소스 — 기존 허브 보강)
      - "bruno vs postman"                # comparison — Bruno(OSS) 트렌딩, postman/insomnia 허브 보강
      - "railway vs render"               # comparison — 신규 PaaS, vercel/netlify 클러스터 보강
      - "fly.io vs railway"               # comparison — 신규 PaaS, 저포화
      - "planetscale vs neon"             # comparison — 서버리스 DB, supabase/firebase 클러스터 보강

  # ── P2: AI 생산성 도구 (비코딩) ──
  - id: ai-productivity
    priority: 2
    hub: "Best AI tools for work (2026)"
    intent: [comparison, transactional]
    patterns:
      - "{toolA} vs {toolB}"
      - "best ai {category} tools"
      - "best alternatives to {tool}"
    unique_data: [feature_matrix, hands_on_notes]
    seeds:
      - "best ai meeting note takers"
      - "jasper vs copy ai"
      - "best ai writing tools 2026"
      - "notion ai alternatives"
      # 🎯 이길 수 있는 롱테일 (허브 보강·페르소나 한정)
      - "otter ai vs fireflies"           # comparison — AI 미팅노트 허브("best ai meeting note takers") 보강
      - "best ai note taking apps for students"  # transactional — 페르소나 한정

  # ── P3: VPN·보안 (초고CPC, 인접·선택적 — 포화·경쟁 큼) ──
  - id: vpn-security
    priority: 3
    hub: "Best VPNs and security tools (2026)"
    intent: [transactional, comparison]
    patterns:
      - "{toolA} vs {toolB}"
      - "best vpn for {use_case}"
      - "best {category} (password managers, antivirus)"
    unique_data: [pricing_table, hands_on_notes]
    seeds:
      - "bitwarden vs 1password"
      - "best password managers 2026"
      - "nordvpn vs expressvpn"
      # 🎯 이길 수 있는 롱테일 (포화 니치라 신규/셀프호스트 각도로만)
      - "vaultwarden vs bitwarden"        # comparison — 셀프호스트 니치, hosting 클러스터 교차링크
      - "proton pass vs bitwarden"        # comparison — Proton Pass 신규, expressvpn류보다 저포화

# 발행 순서 가이드 (PLAN.md 단계와 연결)
sequencing:
  cornerstone_first: true          # 승인 전: hub + P1 핵심 비교글 8~15편을 깊게(품질 우선)
  programmatic_after_approval: true # 승인 후: P1→P2→P3 순으로 패턴 대량 생성(게이트·점진 롤아웃)
  # ⚠️ 재큐레이션(2026-07-08): 강화된 사실대조 검수는 '검증 가능(공식 문서 풍부)' 토픽만 통과시킨다.
  # 니치·신생 툴(cline·zed 등)은 반복 반려되어 20:00 배치가 매일 0편이 되던 문제 → 여기엔 **잘 문서화된
  # 미발행 비교/리스트/가이드**만 우선순위로 둔다. 발행되면 published.json 으로 자동 제외 → 다음 것으로.
  # (검증 어려운 니치는 스코어로 백로그 하위에 남되 상위 10 밖으로 밀려 배치가 시도하지 않음)
  # 재정렬(2026-07-10, 성장플랜): '잘 문서화(강화 검수 통과 가능)' + '기존 발행 17글로 내부링크
  # (신글이 저경쟁이라 먼저 색인·랭크 → 링크주스로 헤드 비교글의 crawled→indexed 전환 촉진)' 순.
  # 내부링크는 site_builder 가 빌드시 실제 발행 페이지로 자동 연결(refresh_internal_links).
  next_batch_priority:
    - "orca vs herdr"                # 🔥 핫 트렌딩(2026-07) — 병렬 에이전트 IDE vs 터미널 멀티플렉서
    - "herdr vs tmux"                # 🔥 핫 트렌딩(2026-07) — agent-aware 멀티플렉서 vs 클래식 tmux
    - "planetscale vs neon"          # 서버리스 DB → supabase/firebase 글 보강, 공식 docs 풍부
    - "fly.io vs railway"            # PaaS → vercel/netlify 글 보강, docs 풍부
    - "how to self-host supabase"    # how-to → supabase/firebase·ghost 가이드 교차링크, 공식 self-host docs
