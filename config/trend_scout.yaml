# trend_scout.yaml — 트렌드 후보 자동 발굴 설정 (engine/ingest/trend_scout.py)
#
# 왜 별도 파일인가: `orchestrator.load_config()` 는 config 이름을 **고정 목록**으로 읽는다.
#   여기에 끼우려면 orchestrator.py 를 고쳐야 하는데, 그 파일은 여러 에이전트가 동시에 만진다.
#   스카우트는 주 1회 사람이 돌리는 보조 도구이므로 자기 설정을 스스로 읽는 편이 충돌이 없다.
#   ⚠️ 그래서 이 파일은 `cfg["trend_scout"]` 로 안 들어온다 — trend_scout.load_cfg() 가 직접 읽는다.
#
# ⛔ 가드레일: 전부 **읽기 전용 공개 API** 다(AUTOMATION.md §0 🟢 자유 자동화).
#    트래픽/클릭 생성·자동 홍보와 무관하고, ToS 를 어기는 스크래핑(X·Reddit)은 하지 않는다.

sources:
  # Hacker News — 'Show HN' 은 신규 툴 런칭 그 자체다. Algolia 공식 API(무료·무인증).
  hackernews:
    enabled: true
    queries: ["coding agent", "AI agent terminal", "agent sandbox", "coding assistant"]
    min_points: 8              # 잡음 차단. 낮추면 후보가 늘지만 검증 호출도 함께 는다
    days: 21                   # 최근 N일 이내 게시물만
  # GitHub — 신규 생성 + 별 급증 = 초저포화 신생툴의 지문. observed.py 가 쓰는 그 API.
  github:
    enabled: true
    queries: ["coding agent", "AI agent CLI", "agent workspace", "terminal agent"]
    min_stars: 60
    days: 45                   # created:>N일전 — '신규'의 정의
    per_query: 10

# 사전 검증 — 8월 실측으로 드러난 실패 모드를 **후보 단계에서** 거른다.
#   문서 비대칭(한쪽 열 56% 공백으로 게이트 탈락) · 저장소 소멸(wandb/catnip 404) · kind 불일치.
#   여기 임계는 발행 게이트가 아니라 **후보 제안 임계**다 — 사람이 최종 확정한다.
preflight:
  min_prose_chars: 3000        # 그라운딩 추출 기준 산문량. 이보다 얇으면 비교표가 빈다
                               # (실측: kbwo/ccmanager 11,667자 = 충분 / 파일목록뿐인 저장소 = 부족)
  require_repo_alive: true     # GitHub API 200 확인 — catnip 처럼 사라진 저장소를 후보로 올리지 않는다
  max_candidates: 24           # 검증 호출 상한(무인증 GitHub 는 분당 10회) — 초과분은 로그에 남긴다
  fetch_timeout: 12

output:
  json: dist/research/trend_scout.json
