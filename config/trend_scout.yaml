# trend_scout.yaml — 트렌드 후보 자동 발굴 설정 (engine/ingest/trend_scout.py)
#
# 왜 별도 파일인가: `orchestrator.load_config()` 는 config 이름을 **고정 목록**으로 읽는다.
#   여기에 끼우려면 orchestrator.py 를 고쳐야 하는데, 그 파일은 여러 에이전트가 동시에 만진다.
#   스카우트는 주 1회 사람이 돌리는 보조 도구이므로 자기 설정을 스스로 읽는 편이 충돌이 없다.
#   ⚠️ 그래서 이 파일은 `cfg["trend_scout"]` 로 안 들어온다 — trend_scout.load_cfg() 가 직접 읽는다.
#
# ⛔ 가드레일: 전부 **읽기 전용 공개 API** 다(AUTOMATION.md §0 🟢 자유 자동화).
#    트래픽/클릭 생성·자동 홍보와 무관하고, ToS 를 어기는 스크래핑(X·Reddit)은 하지 않는다.

sources:
  # Hacker News — 'Show HN' 은 신규 툴 런칭 그 자체다. Algolia 공식 API(무료·무인증).
  hackernews:
    enabled: true
    queries: ["coding agent", "AI agent terminal", "agent sandbox", "coding assistant"]
    min_points: 8              # 잡음 차단. 낮추면 후보가 늘지만 검증 호출도 함께 는다
    days: 21                   # 최근 N일 이내 게시물만
  # GitHub — 신규 생성 + 별 급증 = 초저포화 신생툴의 지문. observed.py 가 쓰는 그 API.
  github:
    enabled: true
    queries: ["coding agent", "AI agent CLI", "agent workspace", "terminal agent",
              "coding agent sandbox", "parallel coding agents", "agent worktree"]
    min_stars: 60
    days: 120                  # created:>N일전 — '신규'의 정의
                               # 🔴 45 였다 → 실측(2026-08-08): 45일 창의 사용가능 후보 14개를 실호출로 재보니
                               #    **릴리스가 있는 것은 6개**
                               #    뿐이었고, 스카우트가 1순위로 제안한 짝(better-harness vs loopkit)은 loopkit 에
                               #    릴리스가 0건이라 관측표가 3행을 못 채운다(observed.usable=False). Graft·paritok·
                               #    oh-my-cli·grok-build·millwright·agentnest·self-learning-skills 도 전부 릴리스 0건.
                               #    갓 만든 저장소는 아직 태그를 안 단다 — '신규'를 120일로 넓혀야 관측 가능한 짝이 나온다.
    per_query: 10

# 사전 검증 — 8월 실측으로 드러난 실패 모드를 **후보 단계에서** 거른다.
#   문서 비대칭(한쪽 열 56% 공백으로 게이트 탈락) · 저장소 소멸(wandb/catnip 404) · kind 불일치.
#   여기 임계는 발행 게이트가 아니라 **후보 제안 임계**다 — 사람이 최종 확정한다.
preflight:
  # ⚠️ 임계는 발행 게이트가 아니라 **후보 제안 임계**다. 최종 확정은 사람이 한다.
  #
  # 🔴 `min_prose_chars` 는 폐기됐다(2026-08-08). 이름을 바꾼 이유 = **재는 대상이 달라졌기 때문**이다.
  #    옛 측정은 `source_fetch` 로 github.com 페이지를 뽑았는데 앞 1,105~3,447자가 **GitHub 사이트
  #    크롬**(내비·Solutions·Resources 메뉴)이었다 → README 가 비어도 3,000 을 통과했다. 측정이 메뉴를
  #    재고 있었다. 같은 키 이름으로 의미만 바꾸면 위 주석이 조용히 거짓이 되므로 키를 갈았다.
  #    (옛 키가 남아 있으면 코드가 경고를 낸다 — 조용한 무시 금지.)
  min_grounding_chars: 3000    # README 실물(raw, 크롬 0) + 공식 사이트의 합
                               # ⛔ 크게 올리지 마라 — 우리 최고 성과 글이 잘린다. 크롬 제외 실측:
                               #    herdrdev/herdr README 2,771(검색유입 53%를 낸 orca-vs-herdr 의 그 herdr)
                               #    dagger/container-use 2,922 · slopus/happy 2,881 (전부 발행 성공)
                               #    smtg-ai/claude-squad 5,162 ← '얇아서 죽었다'던 쪽이 성공작보다 두껍다.
                               #    → **두께는 성패를 예측하지 못한다.** 예측하는 건 아래 두 개다.

  require_releases: true       # 🔴 진짜 사전 판별기. github 단독 엔티티가 만들 수 있는 관측표 행은
                               #    릴리스일·주간커밋·최종커밋 **3개뿐**이라, 하나라도 비면
                               #    `observed.usable(min_rows=3)` 가 수학적으로 불가능하다.
                               #    갓 만든 저장소는 태그를 안 단다 — 45일 창 사용가능 14개 중 릴리스 보유 6개.
                               #    스카우트 1순위였던 better-harness vs loopkit 이 정확히 이 사유로 죽었다.
                               #    판정은 `observed._github` 을 그대로 호출해서 한다(표 만드는 그 코드).

  max_asymmetry: 1.5           # 🔴 두 번째 예측기 — 짝의 근거량 격차. 두께가 아니라 **비대칭**이 문제다.
                               #    `ccmanager vs claude squad` 를 죽인 값이 2.6배였다(한쪽 열 56% 공백).
                               #    0 으로 두면 검사를 끈다.

  require_repo_alive: true     # GitHub API 200 — catnip 처럼 사라진 저장소를 후보로 올리지 않는다
  max_candidates: 24           # 검증 호출 상한(무인증 GitHub 는 분당 10회) — 초과분은 다이제스트에 남긴다
  fetch_timeout: 12

output:
  json: dist/research/trend_scout.json
