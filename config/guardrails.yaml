# guardrails.yaml — 자동화 안전벨트 (AUTOMATION.md §0·§4)
# 이 값들은 코드보다 우선한다. 위반 가능 동작은 구현/실행 금지.

# ⛔ 절대 금지 (구현 안 함 — docs/RESEARCH.md F3, 위반 시 계정 영구 정지)
forbidden:
  - traffic_generation        # 봇/스크립트로 방문 생성
  - click_or_impression_inflation  # 자기/지인/봇 클릭·노출 부풀리기
  - paid_clicks               # 유료 클릭 구매
  - multi_account             # 다계정·프록시 로테이션
  - click_bait_on_ads         # "광고 클릭하세요" 유도 문구
# → 위 항목은 config 토글로도 켤 수 없다. 코드에 경로 자체를 두지 않는다.

# 🟡 발행 점진 롤아웃
rollout:
  # ⏸️ 2026-07-28 사람 승인으로 **신규 생성 일시 중단**(0). 재개는 사람 판단.
  #   왜: 31편을 발행하는 동안 색인은 계속 0이었다(07-27 GSC 실측 39 URL — unknown 29 · crawled-not-indexed 10).
  #   구글은 07-25·27 재크롤에도 판정을 유지했다 = "읽어보고 색인하지 않기로" 반복 판단한 것이다.
  #   새 글은 크롤조차 안 되므로(unknown 29) 편수를 늘리는 것은 문제를 키운다 — 얇은 페이지가 늘수록
  #   사이트 단위 평가만 나빠진다(F12 스케일드 콘텐츠 남용). 그래서 **양을 멈추고**,
  #   이미 읽히고 거절당한 10편에 자체 관측 데이터를 넣어 **재평가를 받는 쪽**으로 전환한다(33-content).
  #   ⚠️ 0 이면 orchestrator.py:337 `passed >= daily` 가 첫 반복에서 참이 되어 생성 루프가 즉시 종료된다.
  #      배포·ingest·monitor·syndicate 는 그대로 돈다(발행할 새 글이 없을 뿐).
  # ⏸️ 2026-08-12 사람 승인으로 **신규 생성 재차 중단**(0). 재개는 사람 판단.
  #   왜: 2026-08-11 AdSense 검토 결과 **"가치가 별로 없는 콘텐츠"로 거절**됐다(계정 사이트 페이지 '주의 필요').
  #   라이브 39편 전수 측정(2026-08-12)이 사유를 특정한다:
  #     · 39/39 편이 `/compare/` 하위 단일 포맷 — generator 는 type="comparison" 한 종류만 낸다
  #     · 26/39 편에 가격 숫자가 **0개**, "confirm current pricing" 회피 문구가 **143회**
  #     · 39/39 편에 본문 이미지·실측 **0**
  #   즉 거절은 편수 부족이 아니라 **사이트 단위 패턴**이다. 여기서 편수를 늘리면 그 패턴만 강해진다
  #   (F12 스케일드 콘텐츠 남용). 양을 멈추고 **기존 39편의 가치를 채우는 쪽**으로 전환한다.
  #   ⚠️ 0 이면 orchestrator.py:559 `passed >= daily` 가 첫 반복에서 참이 되어 생성 루프가 즉시 종료된다.
  #      배포·ingest·monitor·syndicate 는 그대로 돈다 — 수정본 배포에 필요하므로 끄지 않는다.
  # ▶️ 2026-08-15 재개(1) — 사람 지시 "알아서 동작하게, 수동 개입 없이".
  #   중단 사유 세 가지가 무엇으로 해소됐는지:
  #     · 단일 포맷 → 생성 축이 셋이 됐다(pair · timeline · landscape, engine/content/axes.py).
  #       새 축 2편을 실제로 생성해 검수 severity=none 으로 통과시켰고, 둘 다 비교표 블록이 0개다.
  #     · 가격 0개 → 라이브 가격 섹션 22편 중 19편에 검증된 숫자(나머지 3편은 오픈소스라 '무료'가 정답).
  #     · 이미지·실측 0 → 차트 19편 + 1차 데이터 글 6편.
  #   ⚠️ 게이트는 하나도 안 풀었다: 품질게이트·reviewer·휴먼샘플게이트·킬스위치 전부 그대로다.
  #      오늘 실측으로 그 게이트들이 실제로 작동하는 것을 확인했다(시계열 1회차 factual+coherence
  #      high 반려, 지형도 2회 반려 + 1회 보류 → 고친 뒤 통과).
  #   ⚠️ **재신청 자체는 사람만 한다**(API 없음). 이 값은 생성 카덴스일 뿐 신청과 무관하다.
  #   후보가 마르면 0편이 되고 zero_generation_alert_days 가 알린다 — 조용히 멈추지 않는다.
  daily_generate: 1            # 하루 1편. 이전 값 0(2026-08-11 거절 대응 중단)
  daily_publish_cap: 20        # 발행 큐→사이트 점진 발행 상한 (생성과 별개)
  ramp_up_factor: 1.5          # 배치 정상 시 cap 증가율
  ramp_up_max: 200             # cap 상한
  require_indexing_ok_before_next_batch: true
  zero_generation_alert_days: 2  # 신규 생성 0편이 N일 연속이면 알림(monitor.generation_watch).
                                 # ⚠️ 알림만 — 발행 중단 아님(킬스위치와 무관). 0편은 정지 사유가 아니다.
  # 미페치 인용 가드(R0~R4) 계측 트립와이어 — monitor.sources_watch.
  # ⚠️ 위 zero_generation_alert_days 와 **별개다**: 그건 '0편'이라는 결과만 잡고 원인을 가리지 않는다.
  #    이건 반려 사유가 **'인용 0건'인 것만** 센다(가드가 카덴스를 죽이는지 보는 계측).
  # 🔴 R0~R4 는 **측정으로 채택된 게 아니다** — 리플레이 표본이 실초안 6편뿐이라 판단 불가였고,
  #    PM 이 실패 모드의 비대칭(틀리면 글이 적어질 뿐 vs 읽지 않은 페이지를 인용해 발행)으로 채택했다.
  #    진짜 수치는 운영에서 나온다. 아래 임계에 닿으면 PM 이 가드를 재평가한다.
  sources_zero_alert_total: 3    # 누적 N건이면 알림 + PM 보고
  sources_zero_alert_days: 2     # 연속 N일 발생이면 알림 + PM 보고

# 🔴 킬스위치 — 트리거 시 발행 즉시 중단 + 알림 (해제는 사람이 수동)
killswitch:
  enabled: true
  triggers:
    policy_center_warning: true        # AdSense 정책센터 경고
    invalid_traffic_alert: true        # 무효 트래픽 알림 (최우선)
    manual_action: true                # Search Console 수동 조치
    indexing_drop_pct: 30              # 색인률 30% 이상 급락
    cwv_status_poor: true              # Core Web Vitals "불량" 전환
    rpm_drop_pct: 50                   # RPM 50% 이상 급락(이상치)
    new_page_deindex_rate_pct: 40      # 신규 페이지 색인 거부율 임계(저품질 신호)
  auto_resume: false                   # 자동 재개 금지

# 정책 시간 민감성 — 운영 직전 1차 문서 재확인 (docs/RESEARCH.md Caveat 1)
policy_recheck:
  sources:
    - https://support.google.com/adsense/answer/48182   # 무효 트래픽
    - https://support.google.com/adsense/answer/9336650  # RAC (2025-11-01)
  recheck_before_scale: true
