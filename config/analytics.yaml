# analytics.yaml — 자체 사이트 방문 분석(서버사이드 nginx 로그) 설정
# 목적: stack.utilverse.info 의 "어느 페이지에 얼마나 접속했는지" + 추세를, 내 방문/봇 제외하고 본다.
# 원칙: 클라이언트 JS 비콘 없음(CWV 영향 0). nginx 가 이미 남기는 접속 로그만 분석(개인정보처리방침에 로그수집 이미 고지).
# ⛔ 트래픽/클릭 생성과 무관 — 읽기 전용 분석(F3 무효 트래픽과 별개, 리스크 0).

# 입력: stack 전용 access_log (JSON 라인). 회전본(.1, .*.gz) 포함.
logs:
  # nginx 가 stack vhost 전용으로 남기는 JSON 로그(회전 포함 glob)
  json_glob:
    - /var/log/nginx/utilverse.access.log*   # apex(현재 정본)
    - /var/log/nginx/stack.access.log*       # 이전 주소 — 이전 전 이력 + 캐시 만료까지의 잔여 유입
  # (선택) 과거 데이터 보정 — 공용 combined 로그에서 stack 고유 경로만 안전 백필
  legacy_backfill: true
  legacy_glob: /var/log/nginx/access.log*
  # combined 로그는 Host 가 없어 vhost 구분 불가 → stack 에만 존재하는 경로 접두어만 채택(오귀속 방지)
  stack_only_prefixes: ["/compare/", "/ai-coding/", "/hosting/", "/dev-tools/", "/ai-tools/", "/vpn-security/"]

# 나 빼고 — 자기 방문 제외 (3중)
exclude:
  cookie_name: noana          # 이 쿠키=1 이면 집계 제외 (대시보드 버튼으로 설정, IP 바뀌어도 유지)
  ips:                        # 내 고정/현재 IP (대시보드에서 확인 후 추가). CIDR 미지원(정확 일치).
    - "211.54.122.240"        # 현재 접속 IP(자동 감지 프리필) — 바뀌면 갱신
  # 봇/크롤러/스캐너는 아래 패턴으로 분류해 '사람' 통계에서 분리(별도 표시)
  bot_ua_extra: []            # 기본 패턴 외 추가 봇 UA 조각(소문자 부분일치)

# 출력
output:
  dir: /var/www/stack-analytics    # 대시보드 배포 위치(web_root 밖 → 콘텐츠 재배포에도 안 지워짐)
  db: engine/store/analytics.db    # 일자별 롤업 영속화(로그 14일 회전 후에도 추세 유지)
  recent_limit: 200                # 최근 접속 로그 표시 개수
  trend_days: 90                   # 추세 차트 기간

site:
  domain: utilverse.info
  timezone_note: "로그 타임스탬프는 서버 로컬(KST, +09:00) 기준"

# 운영 배치(서버 cron) — 관리자 대시보드 '데이터 수집 주기' 패널에 표기(정보성 + 최근 성공/실패).
# ⚠️ 실서버 crontab 과 일치시켜 관리. cron 변경 시 이 값도 함께 수정.
# 상태 판정: 각 잡의 로그 tail 을 읽어 마지막 실행 시각 + 성공/실패/지연 표시.
#   - ok_marker: 성공 시 로그에 남는 문자열 / fail_marker: 실패 문자열(+ 'Traceback' 은 공통 실패)
#   - start_marker: (멀티라인 잡) 마지막 실행 구간 분리 / max_stale_min: 이 시간 넘게 미실행이면 '지연' 경고
batch_jobs:
  note: "이 방문 분석 대시보드는 15분마다 서버가 자동 수집·갱신합니다."
  jobs:
    - name: "방문 분석 수집 (이 대시보드)"
      schedule: "15분마다"
      cron: "*/15 * * * *"
      detail: "nginx 접속 로그 → 페이지·유입·기기·추세 집계(나·봇 제외). scripts/analytics.sh"
      log: /var/log/adsense_analytics.log
      ok_marker: "analytics:"
      max_stale_min: 40
    - name: "이상 감지 · 킬스위치"
      schedule: "매시간"
      cron: "0 * * * *"
      detail: "정책·색인·Core Web Vitals·RPM 이상 감지 → 이상 시 발행 자동 중단. orchestrator --stage monitor"
      log: /var/log/adsense_monitor.log
      ok_marker: "monitor:"
      max_stale_min: 130
    - name: "일일 파이프라인"
      schedule: "매일 09:00 KST"
      cron: "0 9 * * *"
      detail: "데이터 수집(GSC 검색성과·색인상태·PageSpeed) → 초안 생성·품질 게이트·검수 → 빌드·배포. scripts/daily.sh"
      log: /var/log/adsense_pipeline.log
      start_marker: "=== daily 시작 ==="
      ok_marker: "=== daily 종료 ==="
      fail_marker: "실패 감지"
      max_stale_min: 1560
