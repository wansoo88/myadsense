# content.yaml — 프로그래매틱 SEO 생성 + 품질 게이트 (AUTOMATION.md §3)
# 게이트 없는 대량 = 정지. 모든 페이지는 발행 전 전부 통과해야 함.

generation:
  provider: auto                # api | claude_cli | auto (auto: ANTHROPIC_API_KEY 있으면 api, 없고 claude CLI 있으면 구독 헤드리스, 둘 다 없으면 fixture)
  model: claude-opus-4-8        # 초안 생성. 비용/속도 트레이드오프 시 sonnet 고려
  language: en                  # 기본 영어권(Tier-1, F5). 한국어 고단가 주제 시 ko
  template_dir: templates/      # 페이지 유형별 템플릿 (비교/리스트/가이드 등)
  inject_unique_data: true      # 페이지별 고유 데이터/계산/표 주입 (필수)

# 소스 그라운딩(F10·F14): 생성 전 공식 페이지(pricing/docs)를 페치해 실제 데이터를 프롬프트에 주입 →
# 정확·최신 비교. ⛔ 트래픽 생성 아님(읽기전용·robots 존중). 실패 시 기존 기억-기반 생성으로 폴백.
grounding:
  enabled: true
  max_sources: 5                # 페치 상한(article 당)
  fetch_timeout: 12             # 초
  max_chars_per_source: 3500    # 소스별 주입 텍스트 상한
  validate_source_urls: true    # 모델이 붙인 sources 중 유효(200~3xx)만 유지 — 죽은 인용 제거

# 제3자 공개 API 관측(원저 데이터) — engine/content/observed.py. ORDER 2026-07-25-33 / 2026-07-28-42.
# 왜: 발행분의 출처 49개가 100% 비교 당사자 벤더 자사 도메인이고 자체 측정이 0이었다(31-content 실측) →
#     구글이 재크롤 후에도 색인을 거절했다. 벤더가 자기 페이지에 쓰지 않는 숫자(릴리스 기록·다운로드·장애 이력)를
#     공개 API 로 직접 조회해 관측일·엔드포인트와 함께 싣는다. ⛔ 읽기전용 GET(트래픽 생성과 무관, F3 리스크 0).
# ⚠️ 실패는 비치명적 — 어떤 단계가 실패해도 표 없이 생성이 계속된다(발행이 막히지 않는다).
observed_data:
  enabled: true
  max_entities: 4               # 표에 넣을 제품 수 상한(호출 수 = 제품수 × 소스수)
  timeout: 10                   # 초 (엔드포인트당)
  min_entities: 2               # 이보다 적으면 표를 붙이지 않는다
  min_rows: 3                   # **모든 제품이 값을 가진** 지표가 이보다 적으면 붙이지 않는다(빈 칸 금지)
  min_distinct_rows: 2          # 그중 **제품끼리 값이 갈리는** 행 최소치(무의미한 표 금지).
                                # 3 → 2 로 내림(2026-07-28, PM 승인): 43-review 요구로 `open_issues` 행을 뺐고
                                # (인기·연식의 함수라 결함 비교로 오독됨), 대체 축(이슈 종료시간 중앙값)은
                                # 실측이 못 쓸 수준이었다(flyctl 중앙값 1,396일=스테일봇, vercel·netlify 표본 0).
                                # PM 지시 "없으면 행 수가 줄어도 좋다" → 억지 축을 만드는 대신 기준을 낮춘다.
  sources: [github, npm, statuspage, dockerhub]

# 품질 게이트 — 발행 전 전부 PASS 해야 발행 큐 진입 (quality_gate.py)
quality_gate:
  unique_value:
    require_unique_block: true  # 템플릿 외 고유 데이터/계산/비교/표 ≥1
  near_duplicate:
    method: minhash             # 근접 중복 탐지
    max_similarity: 0.70        # 기존/신규 간 유사도 임계 (초과 시 거부)
  structure:
    require_intent_sections: true   # 검색 의도 충족 섹션 구비
    min_substantive_blocks: 4       # 빈 골격 거부 (숫자 단어수 아님 — 의도 충족 기준)
    min_prose_words: 300            # 실질 산문 최소 단어수(표/헤드라인 제외 intro+섹션+verdict). thin·headline-only = AdSense 거절 1순위 트리거(Google answer/81904) 방지
  eeat:
    require_sources: true       # 출처 인용
    require_dates: true         # 작성/갱신일
    require_author: true        # 저자 정보
    require_schema_org: true    # 구조화 데이터
  policy_screen:
    block_prohibited_topics: true
    block_ad_clickbait: true    # "광고 클릭" 유도 문구 차단
    block_copyright_risk: true
  human_sample_gate:
    enabled: true
    sample_pct: 10              # 배치의 10%는 사람 승인 큐 (캘리브레이션)

# 거부 처리
on_reject:
  log_reason: true
  requeue_for_regeneration: true
  max_regeneration_attempts: 2
