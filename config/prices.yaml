# prices.yaml — 가격 관측 데이터 (벤더 공식 페이지에서 확인한 값만)
#
# 왜 이 파일이 있나: 2026-08-11 AdSense 가 "가치가 별로 없는 콘텐츠"로 사이트를 거절했다.
#   라이브 39편 전수 측정 결과 유료 플랜인데 가격 숫자가 없는 카드가 41개(19편)였고,
#   그 자리에 "confirm current pricing on the vendor's site" 가 143회 들어가 있었다.
#   가격 비교 글이 가격을 안 적으면 원본 출처보다 나은 게 없다 = low value 의 정의다.
#
# 규칙:
#   1. **관측한 값만 적는다.** 못 구한 항목은 비워 두고 `unverified: true` 로 남긴다 —
#      추측한 숫자는 없는 숫자보다 나쁘다(사실 오류가 된다).
#   2. 모든 항목에 `source`(공식 URL)와 `as_of`(관측일)를 단다.
#   3. `price` 는 카드에 그대로 렌더되므로 짧게. 부연은 `note` 로.
#   4. 갱신 시 as_of 를 반드시 같이 올린다. 낡은 날짜가 붙은 값은 낡았음이 보이는 게 낫다.

meta:
  as_of: 2026-08-12
  method: 각 벤더 공식 pricing 페이지 조회(WebFetch/WebSearch). 3자 블로그 수치는 채택하지 않음.
  # 섹션 부제로 렌더되는 문구 — 기존 "Confirm current pricing on each vendor's site." 를 대체한다.
  section_sub: "Prices below were checked against each vendor's official pricing page on {as_of}. Vendors change pricing without notice — the linked page is authoritative."

